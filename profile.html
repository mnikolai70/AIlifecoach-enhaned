<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Your profile — Makis Nikolaidis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#161719;
    --ink-soft:#595C63;
    --navy:#0B0B0D;
    --brass:#C7A24B;
    --line:rgba(22,23,25,0.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:48px 24px;min-height:100vh;
  }
  .top-row{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .brand{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:1rem;
    display:flex;align-items:center;gap:10px;
  }
  .brand img{width:32px;height:32px;object-fit:cover;border-radius:6px;}
  .lang-toggle{
    display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;
  }
  .lang-toggle button{
    border:none;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink-soft);
    font-family:inherit;font-size:inherit;letter-spacing:0.03em;
  }
  .lang-toggle button.active{background:var(--ink);color:var(--paper);}
  .card{width:100%;max-width:440px;border:1px solid var(--line);padding:36px;border-radius:2px;}
  h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.3rem;margin:0 0 6px;}
  p.sub{color:var(--ink-soft);font-size:0.92rem;margin:0 0 26px;}
  label{
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);
    display:block;margin-bottom:8px;margin-top:20px;
  }
  input[type=text], textarea{
    width:100%;border:1px solid var(--line);border-radius:2px;padding:12px 14px;
    font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);background:#fff;
  }
  textarea{resize:vertical;min-height:90px;}
  input:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
  button{
    margin-top:28px;width:100%;background:var(--navy);color:#fff;border:1px solid var(--navy);
    padding:13px 20px;border-radius:2px;font-size:0.95rem;font-weight:500;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button:hover{background:transparent;color:var(--navy);}
  button:disabled{opacity:0.5;cursor:default;}
  #status{color:var(--ink-soft);font-size:0.85rem;margin-top:14px;text-align:center;}
  #error{color:#B3261E;font-size:0.85rem;margin-top:14px;text-align:center;display:none;}
</style>
</head>
<body>

  <div class="top-row">
    <div class="brand">
      <img src="logo.jpg" alt="Makis Nikolaidis logo">
      <span>Makis Nikolaidis</span>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="btn-en" onclick="setLang('en')">EN</button>
      <button id="btn-el" onclick="setLang('el')">ΕΛ</button>
    </div>
  </div>

  <div class="card">
    <h1 id="title">Almost there</h1>
    <p class="sub" id="sub">Tell us a little about yourself so we can personalize your dashboard.</p>

    <form id="profile-form">
      <label id="label-name" for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" required autocomplete="name" placeholder="e.g. Elena Vasiliou">

      <label id="label-interests" for="interests">Areas of interest</label>
      <textarea id="interests" name="interests" required placeholder="e.g. career direction, building better habits, work-life balance…"></textarea>

      <button type="submit" id="submit-btn">Continue to my dashboard</button>
      <div id="status"></div>
      <div id="error"></div>
    </form>
  </div>

<script>
  var copy = {
    en: {
      docTitle: 'Your profile — Makis Nikolaidis',
      title: 'Almost there',
      sub: 'Tell us a little about yourself so we can personalize your dashboard.',
      labelName: 'Full name',
      namePlaceholder: 'e.g. Elena Vasiliou',
      labelInterests: 'Areas of interest',
      interestsPlaceholder: 'e.g. career direction, building better habits, work-life balance…',
      submit: 'Continue to my dashboard',
      saving: 'Saving…',
      errorPrefix: 'Could not save your profile: '
    },
    el: {
      docTitle: 'Το προφίλ σας — Makis Nikolaidis',
      title: 'Σχεδόν εκεί',
      sub: 'Πείτε μας λίγα λόγια για εσάς ώστε να εξατομικεύσουμε τον πίνακά σας.',
      labelName: 'Ονοματεπώνυμο',
      namePlaceholder: 'π.χ. Έλενα Βασιλείου',
      labelInterests: 'Τομείς ενδιαφέροντος',
      interestsPlaceholder: 'π.χ. επαγγελματική κατεύθυνση, χτίσιμο καλύτερων συνηθειών, ισορροπία ζωής-εργασίας…',
      submit: 'Συνέχεια στον πίνακά μου',
      saving: 'Αποθήκευση…',
      errorPrefix: 'Δεν ήταν δυνατή η αποθήκευση του προφίλ σας: '
    }
  };
  var currentLang = 'en';

  function setLang(lang){
    currentLang = lang;
    document.getElementById('doc-title').textContent = copy[lang].docTitle;
    document.title = copy[lang].docTitle;
    document.getElementById('title').textContent = copy[lang].title;
    document.getElementById('sub').textContent = copy[lang].sub;
    document.getElementById('label-name').textContent = copy[lang].labelName;
    document.getElementById('fullName').placeholder = copy[lang].namePlaceholder;
    document.getElementById('label-interests').textContent = copy[lang].labelInterests;
    document.getElementById('interests').placeholder = copy[lang].interestsPlaceholder;
    document.getElementById('submit-btn').textContent = copy[lang].submit;
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-el').classList.toggle('active', lang === 'el');
    try{ localStorage.setItem('waypoint-lang', lang); }catch(e){}
  }

  (function(){
    var saved = 'en';
    try{ saved = localStorage.getItem('waypoint-lang') || 'en'; }catch(e){}
    setLang(saved);
  })();

  var firebaseConfig = {
    apiKey: "AIzaSyA_uG-M8Wz2dqhty8zXtyTUrJyp_hnwhZw",
    authDomain: "lifecoach-authentication.firebaseapp.com",
    projectId: "lifecoach-authentication",
    storageBucket: "lifecoach-authentication.firebasestorage.app",
    messagingSenderId: "937227852104",
    appId: "1:937227852104:web:36edb6dc0add0ef799fb7d",
    measurementId: "G-DSKHMB7D5S"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var currentUser = null;

  function goToDashboard(){
    if (window.opener && !window.opener.closed) {
      window.opener.location.href = 'dashboard.html';
      window.close();
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  auth.onAuthStateChanged(function(user) {
    if (!user) {
      window.location.href = 'signin.html';
      return;
    }
    currentUser = user;

    db.collection('users').doc(user.uid).get().then(function(doc) {
      if (doc.exists && doc.data().fullName && doc.data().interests) {
        goToDashboard();
      } else if (doc.exists && doc.data().fullName) {
        document.getElementById('fullName').value = doc.data().fullName;
      }
    });
  });

  document.getElementById('profile-form').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!currentUser) return;

    var submitBtn = document.getElementById('submit-btn');
    var statusEl = document.getElementById('status');
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    statusEl.textContent = copy[currentLang].saving;

    var fullName = document.getElementById('fullName').value.trim();
    var interests = document.getElementById('interests').value.trim();

    db.collection('users').doc(currentUser.uid).set({
      fullName: fullName,
      interests: interests,
      email: currentUser.email || null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function() {
      goToDashboard();
    }).catch(function(err) {
      submitBtn.disabled = false;
      statusEl.textContent = '';
      errorEl.textContent = copy[currentLang].errorPrefix + err.message;
      errorEl.style.display = 'block';
    });
  });
</script>
</body>
</html>
